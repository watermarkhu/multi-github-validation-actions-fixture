name: release

on:
  pull_request:
    branches: [main]
    types: 
      - opened
      - reopened
      - synchronize
      - edited

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.repository == 'watermarkhu/multi-github-validation-actions'
    permissions:
      contents: write
      pull-requests: write # Required for adding the labels to the PR
      issues: write # Required for adding labels to the repository
    outputs:
      release: ${{ steps.semversie.outputs.release }}
      prerelease: ${{ steps.semversie.outputs.prerelease }}
      release-notes: ${{ steps.semversie.outputs.release-notes }}
      tag: ${{ steps.semversie.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate version
        id: semversie
        uses: RonaldPhilipsen/semVersie@5e6e0f14dc4541ab5e740211db817961d9741b8d # v2.3.2
        with:
          add-pr-label: true
          label-prefix: false

  release:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Force-add built dist to the release tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f push/dist/ report/dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore: bundle dist for ${TAG}"
            git tag -f "${TAG}"
          fi

      - name: Smoke push test
        uses: ./push
        with:
          ref: ${{ env.TAG }}
          target_server_url: https://github.com
          repository: watermarkhu/multi-github-validation-actions-fixture
          upstream_app_id: ${{ vars.WATERMARKHU_APP_ID }}
          upstream_private_key: ${{ secrets.WATERMARKHU_APP_PRIVATE_KEY }}
          target_app_id: ${{ vars.WATERMARKHU_APP_ID }}
          target_private_key: ${{ secrets.WATERMARKHU_APP_PRIVATE_KEY }}

      - name: Create GitHub release
        if: needs.version.outputs.release == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body: ${{ needs.version.outputs.release-notes }}
          tag_name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}

